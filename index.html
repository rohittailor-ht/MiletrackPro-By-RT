<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MileTrack Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#F1EEFF;--sf:#fff;--s2:#E9E6FB;--ink:#0F172A;--mute:#5B6785;--line:#D7DEF0;--ac:#0A84C6;--ac2:#7C5CE0;--good:#0E8F63;--bad:#D6336C;--warn:#B7791F;--glow:rgba(10,132,198,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F1F;--sf:#121A30;--s2:#182244;--ink:#E6ECFF;--mute:#8A97BF;--line:#25315A;--ac:#38BDF8;--ac2:#A78BFA;--good:#34D399;--bad:#FB7185;--warn:#FBBF24;--glow:rgba(56,189,248,.14)}}
:root[data-theme="dark"]{--bg:#0A0F1F;--sf:#121A30;--s2:#182244;--ink:#E6ECFF;--mute:#8A97BF;--line:#25315A;--ac:#38BDF8;--ac2:#A78BFA;--good:#34D399;--bad:#FB7185;--warn:#FBBF24;--glow:rgba(56,189,248,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Space Grotesk","DM Sans",system-ui,sans-serif;margin:0}
.app{max-width:760px;margin:0 auto;padding:12px 14px 110px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{display:flex;align-items:center;gap:10px}
.hd h1{font-size:19px;font-weight:700;flex:1;display:flex;align-items:center;gap:8px}
.hd h1 .ic{color:var(--ac);width:24px;height:24px}
.ib{border:1px solid var(--line);background:var(--sf);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sf);color:var(--mute);border-radius:99px;padding:8px 14px;font:600 14px "Space Grotesk",sans-serif;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border-color:transparent}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .ic{color:var(--ac)}
.hero{background:radial-gradient(120% 90% at 50% 0,var(--glow),transparent 70%),var(--sf);text-align:center}
.gauge{width:min(100%,300px)}
.trk{fill:none;stroke:var(--s2);stroke-width:14;stroke-linecap:round}
.val{fill:none;stroke:url(#gg);stroke-width:14;stroke-linecap:round}
.gv{font:700 36px "Space Grotesk";fill:var(--ink)}.gu{font:500 12px "DM Sans";fill:var(--mute)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.mini div{background:var(--s2);border-radius:12px;padding:8px 4px}
.mini b{display:block;font:600 17px "Space Grotesk"}.mini span,.kpi span,.cap{font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi .ic{color:var(--ac2);margin-bottom:6px}
.kpi b{display:block;font:600 22px "Space Grotesk"}
.ins{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border:0}.ins .ic{margin-top:2px}.ins.good .ic{color:var(--good)}.ins.bad .ic{color:var(--bad)}.ins.info .ic{color:var(--ac)}
.fr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--mute)}
.fr b{display:block;color:var(--ink);font:600 16px "Space Grotesk"}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.bar{height:6px;border-radius:9px;background:var(--s2);margin:10px 0 2px;overflow:hidden}.bar i{display:block;height:100%}
.al{border-radius:14px;padding:10px 14px;margin-top:12px;font-size:14px;display:flex;gap:10px;align-items:center}
.al.soon{background:rgba(251,191,36,.14);color:var(--warn)}.al.over{background:rgba(251,113,133,.14);color:var(--bad)}
form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:500;font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;min-height:46px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;font-weight:400}.chk input{width:22px;min-height:22px;margin-top:2px}
.btn{border:0;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;font:600 16px "Space Grotesk";padding:13px 16px;border-radius:12px;cursor:pointer;min-height:48px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.ghost{border:0;background:none;color:var(--mute);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:500 13px "DM Sans";padding:8px;border-radius:8px}
.ghost.x{color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:18px}.hint{color:var(--mute);font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.item:first-of-type{border:0}
.item .m{flex:1;min-width:0}.item small{display:block;color:var(--mute)}
.tag{font:600 12px "Space Grotesk";padding:3px 10px;border-radius:99px;background:var(--s2);color:var(--ac)}
.tag.soon{background:rgba(251,191,36,.16);color:var(--warn)}.tag.over{background:rgba(251,113,133,.16);color:var(--bad)}
.eff{color:var(--good);font-weight:600}
.seg{display:grid;grid-auto-flow:column;gap:6px}.seg button{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:12px;padding:11px;font:600 15px "Space Grotesk";cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}.seg .on{border-color:var(--ac);color:var(--ac);background:var(--s2)}
.qk{display:flex;gap:6px;flex-wrap:wrap}.qk button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.empty{text-align:center;padding:30px 16px;color:var(--mute)}.empty .ic{width:36px;height:36px;color:var(--ac);margin-bottom:8px}.empty h3{justify-content:center;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto}
nav button{border:0;background:none;color:var(--mute);font:500 11px "DM Sans";padding:9px 2px;cursor:pointer;display:grid;gap:3px;justify-items:center;position:relative}
nav button.on{color:var(--ac)}
nav .fab{margin-top:-20px}nav .fab span.c{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px var(--glow)}
nav .bd{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;display:none;text-align:center}

:root{--c1:#F97316;--c2:#EC4899;--c3:#10B981;--c4:#8B5CF6;--c5:#06B6D4;--c6:#F59E0B}
body{background:radial-gradient(55% 35% at 0 0,rgba(139,92,246,.22),transparent 70%),radial-gradient(50% 35% at 100% 8%,rgba(6,182,212,.2),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(236,72,153,.14),transparent 70%),var(--bg);background-attachment:fixed}
.card h3 .ic{width:30px;height:30px;padding:6px;border-radius:10px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff}
.hero{border-color:transparent;background:radial-gradient(120% 90% at 50% 0,var(--glow),transparent 70%) padding-box,linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--c2),var(--ac2),var(--ac),var(--c3)) border-box}
.kpi .ic{width:36px;height:36px;padding:8px;border-radius:11px;background:color-mix(in srgb,var(--cx) 18%,transparent);color:var(--cx)}
.kpi b{color:var(--cx)}
.kpis .kpi:nth-child(1){--cx:var(--c5)}.kpis .kpi:nth-child(2){--cx:var(--c1)}.kpis .kpi:nth-child(3){--cx:var(--c2)}.kpis .kpi:nth-child(4){--cx:var(--c4)}.kpis .kpi:nth-child(5){--cx:var(--c3)}.kpis .kpi:nth-child(6){--cx:var(--c6)}
.mini div:nth-child(1){--cx:var(--c5)}.mini div:nth-child(2){--cx:var(--c3)}.mini div:nth-child(3){--cx:var(--c1)}.mini div:nth-child(4){--cx:var(--c4)}
.mini div{background:color-mix(in srgb,var(--cx) 15%,transparent)}.mini b{color:var(--cx)}
.chip .ic{color:var(--c2)}.chip.on .ic{color:#fff}
.ins.good .ic{color:var(--c3)}.ins.info .ic{color:var(--c5)}.ins.bad .ic{color:var(--c2)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes sweep{from{stroke-dasharray:0 252}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{box-shadow:0 6px 18px var(--glow)}50%{box-shadow:0 6px 28px 7px var(--glow)}}
@keyframes ring{0%,60%,100%{transform:none}70%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}90%{transform:rotate(6deg)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
#view>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:.07s}#view>*:nth-child(3){animation-delay:.14s}#view>*:nth-child(4){animation-delay:.21s}#view>*:nth-child(5){animation-delay:.28s}#view>*:nth-child(n+6){animation-delay:.35s}
.val{animation:sweep 1.2s cubic-bezier(.3,.7,.2,1) .2s both}
.gv{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.4,.5,1) .35s both}
svg rect[rx="6"]{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
svg rect[rx="6"]:nth-of-type(2){animation-delay:.08s}svg rect[rx="6"]:nth-of-type(3){animation-delay:.16s}svg rect[rx="6"]:nth-of-type(4){animation-delay:.24s}svg rect[rx="6"]:nth-of-type(5){animation-delay:.32s}svg rect[rx="6"]:nth-of-type(6){animation-delay:.4s}
polyline[pathLength]{stroke-dasharray:1;animation:draw 1.3s ease-out .2s both}
.bar i{transform-origin:left;animation:gx .9s cubic-bezier(.2,.8,.2,1) .25s both}
.al.over .ic{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
nav .fab span.c{animation:pulse 2.8s ease-in-out infinite;transition:transform .2s}
nav .fab:hover span.c{transform:scale(1.08) rotate(90deg)}
#toast{animation:tin .3s ease-out}
.kpi,.card,.item{transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 24px var(--glow)}
.btn,.chip,.ghost,.ib,.qk button,.seg button{transition:transform .15s,filter .2s,background .2s}
.btn:hover{filter:brightness(1.1)}.btn:active,.chip:active,.ib:active{transform:scale(.95)}
.chip:hover{transform:translateY(-2px)}.ib:hover .ic{animation:ring .8s}

.qk button.on{background:var(--ac);color:#fff;border-color:transparent}
.bdg{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:linear-gradient(135deg,color-mix(in srgb,var(--c6) 28%,transparent),color-mix(in srgb,var(--c2) 24%,transparent));font-size:13px;font-weight:600}
.bdg .ic{width:16px;height:16px}.bdg.off{opacity:.35;filter:grayscale(1)}
#v-c .on{outline:3px solid var(--ink);outline-offset:2px}
.kpis .kpi:nth-child(7){--cx:var(--c3)}.kpis .kpi:nth-child(8){--cx:var(--c1)}
#ai-o{white-space:pre-wrap;margin-top:10px;font-size:14px}
#view>.card{border-top:3px solid var(--tc,var(--line))}
#view>.card:nth-child(5n+1){--tc:var(--c5)}#view>.card:nth-child(5n+2){--tc:var(--c2)}#view>.card:nth-child(5n+3){--tc:var(--c6)}#view>.card:nth-child(5n+4){--tc:var(--c3)}#view>.card:nth-child(5n+5){--tc:var(--c4)}
#view>.hero{border-top-width:1px}
.seg.s5 button{flex-direction:column;gap:2px;padding:9px 2px;font-size:12px}
.kpis .kpi:nth-child(9){--cx:var(--c4)}.kpis .kpi:nth-child(10){--cx:var(--c5)}
.cmp{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px 10px;align-items:center;font-size:14px}.cmp b{font-family:"Space Grotesk"}.cmp .w{color:var(--good)}.cmp .h{color:var(--mute);font-size:12px}
.card.ban{padding:0;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--ac2) 20%,var(--sf)),color-mix(in srgb,var(--ac) 16%,var(--sf)))}
.bn-art{height:132px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.bn-art img{width:100%;height:100%;object-fit:cover;animation:drive .9s cubic-bezier(.2,.8,.2,1) both}
.bn-art svg{height:124px;width:auto;max-width:100%;animation:drive 1.1s cubic-bezier(.2,.8,.2,1) both}
.bn-t{padding:10px 16px 12px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--sf) 70%,transparent)}
.road line{stroke:var(--mute);stroke-width:2;stroke-dasharray:14 12;animation:road .7s linear infinite}
.sp path{stroke:var(--ac);stroke-width:3;stroke-linecap:round;fill:none;opacity:.5;animation:blink2 1s ease-in-out infinite}
.bob{animation:bob 1.1s ease-in-out infinite}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
.th{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
.pv{width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-top:6px}
.cel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,15,31,.55);backdrop-filter:blur(3px);z-index:50;animation:fadein .25s both}
.cel-c{position:relative;background:var(--sf);color:var(--ac);border-radius:24px;padding:22px 34px 24px;text-align:center;animation:popin .55s cubic-bezier(.3,1.4,.5,1) both;max-width:84%}
.cel-c h3{color:var(--ink);font-size:21px;margin-top:6px}.cel-c p{margin:4px 0 0;color:var(--mute)}
.liq{transform-box:fill-box;transform-origin:bottom;animation:fillup 1.1s cubic-bezier(.3,.7,.3,1) .15s both}
.wave{animation:wave 1.2s linear infinite}
.chk{stroke-dasharray:60;animation:draw2 .5s .95s ease-out both}
.cf{position:absolute;left:50%;top:38%;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:cfly 1.1s ease-out forwards}
#toast .cf{top:0}
#toast .ck{width:18px;height:18px;vertical-align:-4px;stroke:#34D399;stroke-dasharray:24;animation:draw2b .5s ease-out both}
nav button.on .ic{animation:bounce .5s ease-out}
.bdg:not(.off){background-size:200% 100%;animation:shine 3.2s linear infinite;background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--c6) 28%,transparent),color-mix(in srgb,var(--c2) 24%,transparent))}
.empty .ic{animation:float 3s ease-in-out infinite}
.tag.over{animation:blink 1.6s ease-in-out infinite}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px var(--glow);transition:box-shadow .2s}
.chip.on{animation:popin .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{opacity:0;transform:scale(.6)}}
@keyframes fillup{from{transform:scaleY(0)}}
@keyframes wave{to{transform:translateX(-40px)}}
@keyframes draw2{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes draw2b{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes road{to{stroke-dashoffset:-26}}
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes drive{from{transform:translateX(-80px);opacity:0}}
@keyframes bounce{40%{transform:translateY(-6px)}}
@keyframes shine{from{background-position:-120% 0,0 0}to{background-position:220% 0,0 0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes blink{50%{transform:scale(1.08)}}
@keyframes blink2{50%{opacity:.15}}
@keyframes cfly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12M16 14h2"/></symbol>
